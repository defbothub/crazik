<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Крейзік і кульки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#2b1a5e;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;pointer-events:none;z-index:2}
.pill{background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 16px;color:#fff;font-weight:800;font-size:24px;text-shadow:0 0 10px #39ff14;min-width:96px;text-align:center}
.pill.low{color:#ff5a5a;text-shadow:0 0 10px #ff2b2b}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,10,50,.8);z-index:3;padding:24px;text-align:center;color:#fff}
#ov.hide{display:none}
#ov h1{margin:0 0 12px;font-size:30px}
#ov p{margin:0 auto 22px;font-size:18px;line-height:1.4;max-width:320px}
button{font:inherit;font-weight:800;font-size:22px;color:#2b1a5e;background:#ffb000;border:0;border-radius:999px;padding:14px 44px;box-shadow:0 0 22px rgba(255,176,0,.6)}
button:disabled{opacity:.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><div class="pill" id="time">⏱ 90</div><div class="pill" id="score">🎈 0</div></div>
<div id="ov"><div>
  <h1 id="ovt">Крейзік і кульки 🎈</h1>
  <p id="ovp">Лопай кульки: +1 бал за кожну. Обережно із зеленими кульками з ☠: вони забирають 10 балів! У тебе 90 секунд.</p>
  <button id="btn">Старт</button>
</div></div>

<script>
(() => {
// ---------- Налаштування ----------
const DURATION = 90;            // секунд гри
const SPEED_END = 2;            // у скільки разів прискорюється до кінця
const POISON_CHANCE = 0.12;     // частка отруйних кульок
const POISON_PENALTY = 10;
const API_BASE = "";            // напр. "https://your-domain.com/api" (порожньо = демо без сервера)
const PAWS = { lx: -0.3, rx: 0.3, y: 0.5 };  // положення лапок відносно картинки Крейзіка
const COLORS = ["#ff4fa0", "#ffb000", "#19d3c5", "#4da3ff", "#b36bff", "#ff6b4a", "#ffe14d"];
const BUNCH = [[-1.3, -2.7], [0.2, -3.5], [1.4, -2.6]];  // кульки в лапці (в одиницях радіуса)

// ---------- Telegram ----------
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const buzz = (kind, v) => { try { if (!tg || !tg.HapticFeedback) return; kind === "n" ? tg.HapticFeedback.notificationOccurred(v) : tg.HapticFeedback.impactOccurred(v); } catch (e) {} };
async function api(path, body) {
  if (!API_BASE) return null;
  try {
    const r = await fetch(API_BASE + path, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ initData: tg ? tg.initData : "", ...body }) });
    return await r.json();
  } catch (e) { return null; }
}

// ---------- Елементи й розміри ----------
const $ = id => document.getElementById(id);
const cv = $("c"), ctx = cv.getContext("2d");
const timeEl = $("time"), scoreEl = $("score"), ov = $("ov"), ovt = $("ovt"), ovp = $("ovp"), btn = $("btn");
let W, H, S, cw, ch, pawL, pawR, rb;
const img = new Image(); let imgOk = false;
img.onload = () => { imgOk = true; layout(); };
img.src = "crazik.png";   // PNG з прозорим тлом: Крейзік з піднятими лапками, без кульок

function layout() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.max(0.8, Math.min(1.5, Math.min(W, H) / 400));
  cw = Math.min(W * 0.55, H * 0.3, 280);
  ch = imgOk ? cw * img.height / img.width : cw * 0.85;
  const top = H - ch;
  pawL = { x: W / 2 + PAWS.lx * cw, y: top + PAWS.y * ch };
  pawR = { x: W / 2 + PAWS.rx * cw, y: top + PAWS.y * ch };
  rb = cw * 0.15;
}
addEventListener("resize", layout); layout();

// ---------- Стан гри ----------
let state = "idle", t = 0, score = 0, pops = 0, poisons = 0, nextSpawn = 0, last = 0, session = null;
let balloons = [], floats = [], parts = [];
const rnd = (a, b) => a + Math.random() * (b - a);
const mult = () => 1 + (SPEED_END - 1) * Math.min(t / DURATION, 1);   // рівномірно від 1x до 2x

function spawn() {
  const left = Math.random() < 0.5, p = left ? pawL : pawR, dir = left ? -1 : 1;
  const poison = Math.random() < POISON_CHANCE;
  balloons.push({
    x: p.x + rnd(-rb, rb), y: p.y - rb * 2.5, sx: 0, r: rnd(20, 44) * S,
    vy: H * rnd(0.13, 0.30), vx: W * rnd(0.01, 0.09) * (Math.random() < 0.65 ? dir : -dir),
    ph: rnd(0, 6.28), age: 0, poison, c: poison ? "#7dff2a" : COLORS[(Math.random() * COLORS.length) | 0]
  });
}

function update(dt) {
  t += dt;
  const m = mult();
  nextSpawn -= dt;
  while (nextSpawn <= 0) { spawn(); nextSpawn += rnd(0.35, 0.8) / m; }  // густина лишається сталою
  for (const b of balloons) {
    b.age += dt; b.y -= b.vy * m * dt; b.x += b.vx * m * dt;
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
    else if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
    b.sx = b.x + Math.sin(b.age * 2 + b.ph) * 8 * S;
  }
  balloons = balloons.filter(b => b.y > -b.r * 3);
  for (const f of floats) { f.age += dt; f.y -= 50 * S * dt; }
  floats = floats.filter(f => f.age < 0.8);
  for (const p of parts) { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }
  parts = parts.filter(p => p.age < 0.45);
  const left = Math.max(0, Math.ceil(DURATION - t));
  timeEl.textContent = "⏱ " + left; timeEl.classList.toggle("low", left <= 10);
  if (t >= DURATION) endGame();
}

function pop(b) {
  balloons.splice(balloons.indexOf(b), 1);
  if (b.poison) {
    score = Math.max(0, score - POISON_PENALTY); poisons++;
    floats.push({ x: b.sx, y: b.y, txt: "-" + POISON_PENALTY, col: "#ff3b3b", age: 0 }); buzz("n", "error");
  } else {
    score++; pops++;
    floats.push({ x: b.sx, y: b.y, txt: "+1", col: "#39ff14", age: 0 }); buzz("i", "light");
  }
  for (let i = 0; i < 10; i++) {
    const a = rnd(0, 6.283), v = rnd(80, 220) * S;
    parts.push({ x: b.sx, y: b.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, age: 0, c: b.c });
  }
  scoreEl.textContent = "🎈 " + score;
}

cv.addEventListener("pointerdown", e => {
  if (state !== "play") return;
  for (let i = balloons.length - 1; i >= 0; i--) {
    const b = balloons[i];
    const dx = (e.clientX - b.sx) / (b.r + 12 * S), dy = (e.clientY - b.y) / (b.r * 1.18 + 12 * S);
    if (dx * dx + dy * dy <= 1) { pop(b); break; }
  }
});

// ---------- Малювання ----------
function balloonBody(x, y, r, c, poison) {
  const rh = r * 1.18;
  ctx.save();
  ctx.fillStyle = c;
  if (poison) { ctx.shadowColor = "#7dff2a"; ctx.shadowBlur = 18; }
  ctx.beginPath(); ctx.ellipse(x, y, r, rh, 0, 0, 6.283); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.beginPath(); ctx.moveTo(x, y + rh - 1); ctx.lineTo(x - r * 0.18, y + rh + r * 0.2); ctx.lineTo(x + r * 0.18, y + rh + r * 0.2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.beginPath(); ctx.ellipse(x - r * 0.35, y - rh * 0.4, r * 0.18, r * 0.3, -0.5, 0, 6.283); ctx.fill();
  if (poison) {
    ctx.font = `${r * 1.1}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "#1b0b3a"; ctx.fillText("☠", x, y + r * 0.05);
  }
  ctx.restore();
}

function drawBunch(p, seed) {
  const tt = performance.now() / 1000;
  BUNCH.forEach(([ox, oy], i) => {
    const x = p.x + ox * rb + Math.sin(tt * 1.4 + i + seed) * 4;
    const y = p.y + oy * rb + Math.cos(tt * 1.1 + i + seed) * 3;
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(x, y + rb * 1.4); ctx.stroke();
    balloonBody(x, y, rb, COLORS[(i * 2 + seed) % COLORS.length], false);
  });
}

function drawCrazik() {
  if (imgOk) ctx.drawImage(img, W / 2 - cw / 2, H - ch, cw, ch);
}

function render() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#2b1a5e"); g.addColorStop(1, "#6b4fbb");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // кульки гри (під пучками в лапках: вони вилітають «з-за» них)
  for (const b of balloons) {
    const y0 = b.y + b.r * 1.38;
    ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(b.sx, y0);
    ctx.quadraticCurveTo(b.sx + Math.sin(b.age * 3 + b.ph) * b.r * 0.4, y0 + b.r * 0.6, b.sx, y0 + b.r * 1.2); ctx.stroke();
    balloonBody(b.sx, b.y, b.r, b.c, b.poison);
  }
  drawBunch(pawL, 0); drawBunch(pawR, 2);
  drawCrazik();

  for (const p of parts) {
    ctx.globalAlpha = 1 - p.age / 0.45; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, 4 * S, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const f of floats) {   // неонове +1 / -10
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - Math.pow(f.age / 0.8, 2));
    ctx.font = `900 ${36 * S}px system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = f.col; ctx.shadowBlur = 22; ctx.lineWidth = 4; ctx.strokeStyle = f.col;
    ctx.strokeText(f.txt, f.x, f.y);
    ctx.shadowBlur = 0; ctx.fillStyle = "#fff"; ctx.fillText(f.txt, f.x, f.y);
    ctx.restore();
  }
}

function frame(ts) {
  const dt = Math.min((ts - last) / 1000, 0.05); last = ts;
  if (state === "play") update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- Старт і фініш ----------
let btnAction = startGame;
btn.onclick = () => btnAction();
function showOverlay(title, html, label, action) {
  ovt.textContent = title; ovp.innerHTML = html; btn.textContent = label; btnAction = action;
  btn.disabled = false; ov.classList.remove("hide");
}
const closeApp = () => (tg ? tg.close() : location.reload());

async function startGame() {
  btn.disabled = true;
  const s = await api("/game/start", {});
  if (s && s.error) { showOverlay("Ой 🙈", s.error, "Закрити", closeApp); return; }
  session = s;
  t = 0; score = 0; pops = 0; poisons = 0; nextSpawn = 0;
  balloons = []; floats = []; parts = [];
  scoreEl.textContent = "🎈 0"; timeEl.textContent = "⏱ " + DURATION; timeEl.classList.remove("low");
  ov.classList.add("hide"); btn.disabled = false; state = "play";
}

async function endGame() {
  state = "over";
  buzz("n", "success");
  showOverlay("Час вийшов! ⏰", `Твій рахунок <b>${score}</b> балів 🎈`, "Готово", closeApp);
  const res = await api("/game/finish", { token: session && session.token, score, pops, poisons });
  if (res && typeof res.points === "number") ovp.innerHTML += `<br>Зараховано: <b>${res.points}</b>`;
}
})();
</script>
</body>
</html>
